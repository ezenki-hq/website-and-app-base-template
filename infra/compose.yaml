services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql

  backend:
    build:
      context: ../backend
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: ${DJANGO_DEBUG}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
      WAGTAIL_SITE_NAME: ${WAGTAIL_SITE_NAME:-Billboard website}
      WAGTAILADMIN_BASE_URL: ${WAGTAILADMIN_BASE_URL:-http://localhost:8000}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      NATS_URL: nats://nats:4222
      NATS_BACKEND_USER: ${NATS_BACKEND_USER}
      NATS_BACKEND_PASSWORD: ${NATS_BACKEND_PASSWORD}
      EVENTS_JWT_SIGNING_SECRET: ${EVENTS_JWT_SIGNING_SECRET}
      EVENTS_JWT_TTL_SECONDS: ${EVENTS_JWT_TTL_SECONDS}
      EVENTS_ALLOWED_ORIGINS: ${EVENTS_ALLOWED_ORIGINS}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - static-assets:/app/staticfiles
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen("http://localhost:8000/health/", timeout=2)
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build:
      context: ../web
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL}
      VITE_EVENTS_WEBSOCKET_URL: ${VITE_EVENTS_WEBSOCKET_URL}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch("http://127.0.0.1:5173/")
            .then((response) => {
              if (!response.ok) process.exit(1);
            })
            .catch(() => process.exit(1))
      interval: 5s
      timeout: 5s
      retries: 20

  nats:
    image: nats:2.14-alpine
    command: ["-c", "/etc/nats/nats.conf"]
    environment:
      NATS_BACKEND_USER: ${NATS_BACKEND_USER}
      NATS_BACKEND_PASSWORD: ${NATS_BACKEND_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - ./nats/nats.conf:/etc/nats/nats.conf:ro

  nginx:
    image: nginx:1.30-alpine
    depends_on:
      backend:
        condition: service_healthy
      nats:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget --quiet --output-document=/dev/null
          --header='Host: localhost' http://127.0.0.1/health/
          && wget --quiet --output-document=/dev/null
          --header='Host: app.localhost' http://127.0.0.1/
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "8081:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d/default.conf:/etc/nginx/app.conf:ro
      - static-assets:/var/www/static:ro


volumes:
  postgres-data:
  static-assets:
