[project]
name = "website-app-template-backend"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "Django>=5.2,<5.3",
  "wagtail>=7.4,<7.5",
  "psycopg[binary]>=3.2,<4",
  "gunicorn>=23,<24",
  "PyJWT>=2.10,<3",
  "channels>=4.3,<5",
  "nats-py>=2.15,<3",
  "msgpack>=1.2,<2",
  "uvicorn[standard]>=0.35,<1",
  "uvicorn-worker>=0.4,<1",
]

[tool.uv]
constraint-dependencies = ["django-treebeard<5"]

[dependency-groups]
dev = ["daphne>=4.2,<5"]
